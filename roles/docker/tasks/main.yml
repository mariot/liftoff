---
# Docker role — installs Docker Engine + Compose plugin if not already present.
# Supports Debian/Ubuntu and RHEL/CentOS/Rocky/AlmaLinux.

- name: Check if Docker is already installed
  ansible.builtin.command: docker --version
  register: docker_check
  changed_when: false
  failed_when: false

- name: Install Docker on Debian/Ubuntu
  when:
    - docker_check.rc != 0
    - ansible_os_family == "Debian"
  block:
    - name: Install prerequisite packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true

    - name: Create Docker apt keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker GPG key
      ansible.builtin.shell: |
        curl -fsSL https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg \
          | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
        chmod a+r /etc/apt/keyrings/docker.gpg
      args:
        creates: /etc/apt/keyrings/docker.gpg

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') | replace('aarch64', 'arm64') }}
          signed-by=/etc/apt/keyrings/docker.gpg]
          https://download.docker.com/linux/{{ ansible_distribution | lower }}
          {{ ansible_distribution_release }} stable
        filename: docker
        state: present

    - name: Install Docker packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true
      notify: Restart Docker

- name: Install Docker on RHEL/CentOS/Rocky/Alma
  when:
    - docker_check.rc != 0
    - ansible_os_family == "RedHat"
  block:
    - name: Install yum-utils
      ansible.builtin.dnf:
        name: yum-utils
        state: present

    - name: Add Docker DNF repository
      ansible.builtin.command: >
        yum-config-manager --add-repo
        https://download.docker.com/linux/centos/docker-ce.repo
      args:
        creates: /etc/yum.repos.d/docker-ce.repo

    - name: Install Docker packages
      ansible.builtin.dnf:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
      notify: Restart Docker

- name: Ensure Docker service is enabled and running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Add ansible_user to docker group
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true

# ─── Extra tools ──────────────────────────────────────────────────────────────

- name: Install extra tools (Debian/Ubuntu)
  ansible.builtin.apt:
    name:
      - magic-wormhole
    state: present
    update_cache: false
  when: ansible_os_family == "Debian"

- name: Install extra tools (RHEL/CentOS/Rocky/Alma)
  ansible.builtin.dnf:
    name:
      - magic-wormhole
    state: present
  when: ansible_os_family == "RedHat"

# ─── ARM64: enable amd64 (x86_64) userspace for running amd64 binaries ───────
# Adds amd64 dpkg architecture + x86_64 glibc so QEMU user-mode can exec
# linux/amd64 binaries directly (e.g. Palo Alto Cortex XDR / d1 agent).

- name: Check if amd64 architecture is already registered (ARM64 + Debian only)
  ansible.builtin.command: dpkg --print-foreign-architectures
  register: dpkg_foreign_archs
  changed_when: false
  failed_when: false
  when:
    - ansible_architecture == "aarch64"
    - ansible_os_family == "Debian"

- name: Add amd64 architecture to dpkg (ARM64 + Debian only)
  ansible.builtin.command: dpkg --add-architecture amd64
  register: dpkg_add_arch
  changed_when: true
  when:
    - ansible_architecture == "aarch64"
    - ansible_os_family == "Debian"
    - "'amd64' not in dpkg_foreign_archs.stdout"

- name: Refresh apt cache after adding amd64 arch (ARM64 + Debian only)
  ansible.builtin.apt:
    update_cache: true
  when:
    - ansible_architecture == "aarch64"
    - ansible_os_family == "Debian"
    - dpkg_add_arch is changed

- name: Detect qemu package name (ARM64 + Debian only)
  # Ubuntu ≤24.04 ships qemu-user-static as a concrete package;
  # Ubuntu ≥26.04 replaced it with qemu-user-binfmt.
  ansible.builtin.shell: |
    if apt-cache show qemu-user-static 2>/dev/null | grep -q "^Filename:"; then
      echo "qemu-user-static"
    else
      echo "qemu-user-binfmt"
    fi
  args:
    executable: /bin/bash
  register: _qemu_pkg_name
  changed_when: false
  when:
    - ansible_architecture == "aarch64"
    - ansible_os_family == "Debian"

- name: Install qemu and binfmt-support (ARM64 + Debian only)
  ansible.builtin.apt:
    name:
      - "{{ _qemu_pkg_name.stdout }}"
      - binfmt-support
    state: present
  when:
    - ansible_architecture == "aarch64"
    - ansible_os_family == "Debian"

- name: Install x86_64 runtime libs for amd64 binary emulation (ARM64 + Debian only)
  ansible.builtin.apt:
    name:
      - libc6:amd64
      - libstdc++6:amd64
    state: present
  when:
    - ansible_architecture == "aarch64"
    - ansible_os_family == "Debian"

- name: Ensure /lib64 directory exists (ARM64 only)
  ansible.builtin.file:
    path: /lib64
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: ansible_architecture == "aarch64"

- name: Symlink x86_64 dynamic linker to /lib64 (ARM64 only)
  ansible.builtin.file:
    src: /lib/x86_64-linux-gnu/ld-linux-x86-64.so.2
    dest: /lib64/ld-linux-x86-64.so.2
    state: link
    owner: root
    group: root
  when:
    - ansible_architecture == "aarch64"
    - ansible_os_family == "Debian"

- name: Detect qemu-x86_64 interpreter path (ARM64 only)
  ansible.builtin.shell: |
    if command -v qemu-x86_64-static >/dev/null 2>&1; then
      command -v qemu-x86_64-static
    elif command -v qemu-x86_64 >/dev/null 2>&1; then
      command -v qemu-x86_64
    else
      exit 1
    fi
  args:
    executable: /bin/bash
  register: qemu_x86_64_interpreter
  changed_when: false
  when: ansible_architecture == "aarch64"

- name: Fail if qemu-x86_64 interpreter was not found (ARM64 only)
  ansible.builtin.fail:
    msg: "qemu-x86_64 interpreter not found after package installation"
  when:
    - ansible_architecture == "aarch64"
    - qemu_x86_64_interpreter.rc != 0

- name: Write persistent binfmts config for qemu-x86_64 (ARM64 only)
  ansible.builtin.copy:
    dest: /usr/share/binfmts/qemu-x86_64
    owner: root
    group: root
    mode: "0644"
    content: |
      package qemu-user-static
      interpreter {{ qemu_x86_64_interpreter.stdout }}
      magic \x7fELF\x02\x01\x01\x00\x00\x00\x00\x00\x00\x00\x00\x00\x02\x00\x3e\x00
      mask \xff\xff\xff\xff\xff\xfe\xfe\x00\xff\xff\xff\xff\xff\xff\xff\xff\xfe\xff\xff\xff
      credentials yes
      fix-binary yes
  when: ansible_architecture == "aarch64"

- name: Register qemu-x86_64 binfmt handler (ARM64 only)
  ansible.builtin.command: update-binfmts --enable qemu-x86_64
  register: binfmt_enable
  changed_when: "'already enabled' not in binfmt_enable.stderr"
  failed_when: binfmt_enable.rc != 0 and 'already enabled' not in binfmt_enable.stderr
  when: ansible_architecture == "aarch64"

- name: Ensure qemu-x86_64 binfmt handler is active in kernel (ARM64 only)
  ansible.builtin.shell: |
    if ! grep -q '^enabled' /proc/sys/fs/binfmt_misc/qemu-x86_64 2>/dev/null; then
      echo ':qemu-x86_64:M:0:\x7fELF\x02\x01\x01\x00\x00\x00\x00\x00\x00\x00\x00\x00\x02\x00\x3e\x00:\xff\xff\xff\xff\xff\xfe\xfe\x00\xff\xff\xff\xff\xff\xff\xff\xff\xfe\xff\xff\xff:{{ qemu_x86_64_interpreter.stdout }}:F' > /proc/sys/fs/binfmt_misc/register
    fi
  args:
    executable: /bin/bash
  changed_when: false
  when: ansible_architecture == "aarch64"
