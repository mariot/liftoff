---
# xtm_deploy role — copies docker-compose files and brings up the XTM stack.
# Secrets (.env) are generated once on first deploy and never overwritten.

- name: Ensure deploy directory exists
  ansible.builtin.file:
    path: "{{ xtm_deploy_dir }}"
    state: directory
    owner: root
    group: docker
    mode: "0750"

- name: Copy docker-compose.yml
  ansible.builtin.copy:
    src: docker-compose.yml
    dest: "{{ xtm_deploy_dir }}/docker-compose.yml"
    owner: root
    group: docker
    mode: "0640"


# ─── Secret generation (run only if .env does not yet exist) ─────────────────

- name: Check if .env already exists
  ansible.builtin.stat:
    path: "{{ xtm_deploy_dir }}/.env"
  register: env_file

- name: Generate secrets (first-time setup only)
  when: not env_file.stat.exists
  block:
    # All generation runs on the control node via Python 3 (always available
    # since Ansible itself requires it) — no uuidgen/openssl needed on the target.
    - name: Generate all UUIDs and secrets on the control node
      ansible.builtin.set_fact:
        _uuids:
          xtm_composer_id:                     "{{ lookup('pipe', _uuid_cmd) }}"
          opencti_admin_token:                 "{{ lookup('pipe', _uuid_cmd) }}"
          opencti_healthcheck_key:             "{{ lookup('pipe', _uuid_cmd) }}"
          connector_export_file_stix_id:       "{{ lookup('pipe', _uuid_cmd) }}"
          connector_export_file_csv_id:        "{{ lookup('pipe', _uuid_cmd) }}"
          connector_export_file_txt_id:        "{{ lookup('pipe', _uuid_cmd) }}"
          connector_import_file_stix_id:       "{{ lookup('pipe', _uuid_cmd) }}"
          connector_import_document_id:        "{{ lookup('pipe', _uuid_cmd) }}"
          connector_import_file_yara_id:       "{{ lookup('pipe', _uuid_cmd) }}"
          connector_import_external_reference_id: "{{ lookup('pipe', _uuid_cmd) }}"
          connector_analysis_id:               "{{ lookup('pipe', _uuid_cmd) }}"
          connector_opencti_id:                "{{ lookup('pipe', _uuid_cmd) }}"
          connector_mitre_id:                  "{{ lookup('pipe', _uuid_cmd) }}"
          openaev_admin_token:                 "{{ lookup('pipe', _uuid_cmd) }}"
          collector_mitre_attack_id:           "{{ lookup('pipe', _uuid_cmd) }}"
          collector_openaev_id:                "{{ lookup('pipe', _uuid_cmd) }}"
          collector_atomic_red_team_id:        "{{ lookup('pipe', _uuid_cmd) }}"
          collector_nvd_nist_cve_id:           "{{ lookup('pipe', _uuid_cmd) }}"
          injector_nmap_id:                    "{{ lookup('pipe', _uuid_cmd) }}"
          injector_nuclei_id:                  "{{ lookup('pipe', _uuid_cmd) }}"
        _passwords:
          minio_root_password:          "{{ lookup('password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}"
          rabbitmq_default_pass:        "{{ lookup('password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}"
          postgres_password:            "{{ lookup('password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}"
          opensearch_admin_password:    "{{ lookup('password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}"
          opencti_admin_password:       "{{ lookup('password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}"
          openaev_admin_password:       "{{ lookup('password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}"
          openaev_healthcheck_key:      "{{ lookup('password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}"
          openaev_admin_encryption_salt: "{{ lookup('password', '/dev/null', length=16, chars=['ascii_letters', 'digits']) }}"
        _opencti_encryption_key: "{{ lookup('pipe', _b64key_cmd) }}"
        _openaev_encryption_key:  "{{ lookup('pipe', _b64key_cmd) }}"
      vars:
        _uuid_cmd: "python3 -c 'import uuid; print(uuid.uuid4())'"
        _b64key_cmd: "python3 -c 'import secrets,base64; print(base64.b64encode(secrets.token_bytes(32)).decode())'"

    - name: Write .env file from template
      ansible.builtin.template:
        src: env.j2
        dest: "{{ xtm_deploy_dir }}/.env"
        owner: root
        group: docker
        mode: "0640"
      vars:
        uuids: "{{ _uuids }}"
        passwords: "{{ _passwords }}"
        opencti_encryption_key: "{{ _opencti_encryption_key }}"
        openaev_encryption_key: "{{ _openaev_encryption_key }}"

# ─── Docker Compose ───────────────────────────────────────────────────────────

- name: Pull latest images
  ansible.builtin.command:
    cmd: docker compose pull
    chdir: "{{ xtm_deploy_dir }}"
  register: compose_pull
  changed_when: "'Pulled' in compose_pull.stdout or 'pulled' in compose_pull.stderr"
  retries: 3
  delay: 15
  until: compose_pull.rc == 0

- name: Bring up XTM stack
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans
    chdir: "{{ xtm_deploy_dir }}"
  register: compose_up
  changed_when: "'Started' in compose_up.stderr or 'Created' in compose_up.stderr"
  failed_when: false

- name: Read OpenCTI/OpenAEV access values from deployed .env
  ansible.builtin.command:
    cmd: >-
      python3 -c "import json; keys={
      'OPENCTI_EXTERNAL_SCHEME','OPENCTI_HOST','OPENCTI_PORT','OPENCTI_ADMIN_EMAIL','OPENCTI_ADMIN_PASSWORD',
      'OPENAEV_EXTERNAL_SCHEME','OPENAEV_HOST','OPENAEV_PORT','OPENAEV_ADMIN_EMAIL','OPENAEV_ADMIN_PASSWORD'};
      out={};
      [out.setdefault(k, v) for line in open('{{ xtm_deploy_dir }}/.env', encoding='utf-8')
      if '=' in line for k, v in [line.rstrip('\n').split('=', 1)] if k in keys];
      print(json.dumps(out))"
  register: xtm_access_values_raw
  changed_when: false
  no_log: true

- name: Build access info object
  ansible.builtin.set_fact:
    xtm_access_values: "{{ xtm_access_values_raw.stdout | from_json }}"
  no_log: true

- name: Output OpenCTI/OpenAEV access details
  ansible.builtin.debug:
    msg:
      - "OpenCTI URL: {{ xtm_access_values.OPENCTI_EXTERNAL_SCHEME }}://{{ xtm_access_values.OPENCTI_HOST }}:{{ xtm_access_values.OPENCTI_PORT }}"
      - "OpenCTI Email: {{ xtm_access_values.OPENCTI_ADMIN_EMAIL }}"
      - "OpenCTI Password: {{ xtm_access_values.OPENCTI_ADMIN_PASSWORD }}"
      - "OpenAEV URL: {{ xtm_access_values.OPENAEV_EXTERNAL_SCHEME }}://{{ xtm_access_values.OPENAEV_HOST }}:{{ xtm_access_values.OPENAEV_PORT }}"
      - "OpenAEV Email: {{ xtm_access_values.OPENAEV_ADMIN_EMAIL }}"
      - "OpenAEV Password: {{ xtm_access_values.OPENAEV_ADMIN_PASSWORD }}"

- name: Fail deploy when docker compose up reports an error
  ansible.builtin.fail:
    msg: "docker compose up failed (rc={{ compose_up.rc }}). Check service health with: docker compose ps and docker compose logs"
  when: compose_up.rc != 0

